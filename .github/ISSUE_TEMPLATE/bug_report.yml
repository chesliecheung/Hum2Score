name: Bug 报告
description: 报告可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传包含私人信息的录音。
  - type: input
    id: version
    attributes:
      label: Hum2Score 版本
      placeholder: 例如 0.4.2
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 操作系统与设备
      placeholder: 例如 macOS 15，Apple M2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请列出触发问题的最短步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附截图、日志和识别参数。请移除敏感信息。
